name: Rebuild Depth Pro screenshots

on:
  push:
    paths:
      - '.publish/**'
      - '.github/workflows/rebuild_depth_images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild object screenshot
        shell: bash
        run: |
          set -e
          mkdir -p docs/images
          cat .publish/object1.part* > /tmp/object1.b64
          cat .publish/object1tailhex.part* | tr -d '\n\r ' | xxd -r -p >> /tmp/object1.b64
          for f in $(find .publish -maxdepth 1 -name 'object1taildec.part*' | sort); do
            awk -F, '{for(i=1;i<=NF;i++) if($i!="") printf "%c",$i}' "$f"
          done >> /tmp/object1.b64
          tr -d '\n\r ' < /tmp/object1.b64 | base64 -d > docs/images/object-depth-1.png
          test "$(wc -c < docs/images/object-depth-1.png)" -eq 880907
          rm -f .publish/object1*
          rmdir .publish 2>/dev/null || true
      - name: Commit screenshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images .publish
          git commit -m "Add final Depth Pro screenshot"
          git push
