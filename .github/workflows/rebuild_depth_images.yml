name: Rebuild Depth Pro screenshots

on:
  push:
    paths:
      - '.publish/**'
      - '.github/workflows/rebuild_depth_images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild screenshots
        shell: bash
        run: |
          set -e
          mkdir -p docs/images
          cat .publish/hand.part* | tr -d '\n\r ' | base64 -d > docs/images/hand-depth.png
          cat .publish/object2.part* | tr -d '\n\r ' | base64 -d > docs/images/object-depth-2.png
          test "$(wc -c < docs/images/hand-depth.png)" -eq 976450
          test "$(wc -c < docs/images/object-depth-2.png)" -eq 1046742
          rm -f .publish/hand.part* .publish/object2.part*
      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images .publish
          git commit -m "Add Depth Pro demo screenshots"
          git push
