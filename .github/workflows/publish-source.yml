name: Publish source
on:
  push:
    paths:
      - PUBLISH_SOURCE
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and unpack source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-payload/chunk*.txt > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/. .
          rm -rf .source-payload PUBLISH_SOURCE .github/workflows/publish-source.yml
      - name: Commit published source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish cleaned project source" || exit 0
          git push
